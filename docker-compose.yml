version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: swstarter-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: swstarter
      POSTGRES_USER: swstarter
      POSTGRES_PASSWORD: secret
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
